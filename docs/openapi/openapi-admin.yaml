openapi: 3.0.3
info:
  title: Go Produk - Admin API
  version: "1.0"
  description: Dokumentasi API untuk administrator platform
  contact:
    name: Admin Support
    url: https://support.go-produk.local

servers:
  - url: /
    description: Current server
  - url: https://api.go-produk.com
    description: Production

tags:
  - name: Auth
    description: Authentication endpoints (publik)
  - name: Users
    description: User management (admin only)
  - name: Categories
    description: Category management (admin only)
  - name: Products
    description: Product management (admin only)
  - name: Templates
    description: Template management (admin only)
  - name: Template Versions
    description: Template version management (admin only)
  - name: User Projects
    description: User project management (admin only)

paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login admin user
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout admin
      operationId: adminLogout
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories:
    get:
      tags:
        - Categories
      summary: List all categories
      operationId: adminListCategories
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Categories
      summary: Create new category
      operationId: createCategory
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      operationId: adminGetCategoryByID
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Categories
      summary: Update category
      operationId: updateCategory
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategory"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Categories
      summary: Delete category
      operationId: deleteCategory
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Category deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products:
    get:
      tags:
        - Products
      summary: List all products
      operationId: adminListProducts
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Products
      summary: Create new product
      operationId: createProduct
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      operationId: adminGetProductByID
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Products
      summary: Update product
      operationId: updateProduct
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Products
      summary: Delete product
      operationId: deleteProduct
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Product deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/templates:
    get:
      tags:
        - Templates
      summary: List all templates
      operationId: adminListTemplates
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplatesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Templates
      summary: Create new template
      operationId: createTemplate
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/templates/{id}:
    get:
      tags:
        - Templates
      summary: Get template by ID
      operationId: adminGetTemplateByID
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Templates
      summary: Update template
      operationId: updateTemplate
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateRequest"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Templates
      summary: Delete template
      operationId: deleteTemplate
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Template deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/template-versions:
    get:
      tags:
        - Template Versions
      summary: List template versions
      operationId: adminListTemplateVersions
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: template_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of template versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateVersionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Template Versions
      summary: Create template version
      operationId: createTemplateVersion
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateVersionRequest"
      responses:
        "201":
          description: Template version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/template-versions/{id}:
    get:
      tags:
        - Template Versions
      summary: Get template version by ID
      operationId: adminGetTemplateVersionByID
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: Template version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Template Versions
      summary: Update template version
      operationId: updateTemplateVersion
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateVersionRequest"
      responses:
        "200":
          description: Template version updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTemplateVersion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - Template Versions
      summary: Delete template version
      operationId: deleteTemplateVersion
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: Template version deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/user-projects:
    get:
      tags:
        - User Projects
      summary: List all user projects
      operationId: adminListUserProjects
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        "200":
          description: List of user projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/user-projects/{id}:
    get:
      tags:
        - User Projects
      summary: Get user project detail
      operationId: adminGetUserProjectByID
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "200":
          description: User project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags:
        - User Projects
      summary: Delete user project
      operationId: adminDeleteUserProject
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IDParam"
      responses:
        "204":
          description: User project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT access token (admin user only) disimpan pada HttpOnly cookie `access_token`

  parameters:
    IDParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

  responses:
    Unauthorized:
      description: Unauthorized - Token invalid, expired, atau user bukan admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Forbidden - User tidak memiliki role admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # Common schemas
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
        - errors

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    # Auth schemas
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Token expiration in seconds
      required:
        - user
        - access_token
        - expires_in

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin]
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - is_active
        - created_at
        - updated_at

    # Category Admin schemas
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - is_active

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 3
        description:
          type: string
        is_active:
          type: boolean
          default: true
      required:
        - name
        - slug

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 3
        description:
          type: string
        is_active:
          type: boolean
      minProperties: 1

    AdminCategoriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminCategory"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination

    # Product Admin schemas
    AdminProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - price
        - category_id
        - is_active

    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 3
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
          default: true
      required:
        - name
        - slug
        - price
        - category_id

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        slug:
          type: string
          minLength: 3
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
      minProperties: 1

    AdminProductsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminProduct"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination

    # Template Admin schemas
    AdminTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - category_id
        - is_active

    CreateTemplateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        description:
          type: string
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
          default: true
      required:
        - name
        - category_id

    UpdateTemplateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        description:
          type: string
        category_id:
          type: string
          format: uuid
        is_active:
          type: boolean
      minProperties: 1

    AdminTemplatesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminTemplate"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination

    # Template Version Admin schemas
    AdminTemplateVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        version:
          type: integer
        content:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - template_id
        - version
        - is_active

    CreateTemplateVersionRequest:
      type: object
      properties:
        template_id:
          type: string
          format: uuid
        content:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
          default: true
      required:
        - template_id
        - content

    UpdateTemplateVersionRequest:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
      minProperties: 1

    AdminTemplateVersionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminTemplateVersion"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required:
        - data
        - pagination

    # User Project Admin schemas
